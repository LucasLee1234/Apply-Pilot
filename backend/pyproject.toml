[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lucas-git-maker", email = "lhongbo123@yahoo.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.146.0",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
